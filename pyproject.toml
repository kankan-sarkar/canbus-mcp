[project]
name = "can-engineering-mcp"
version = "0.1.0"
description = "MCP server for deterministic CAN bus (Classical CAN & CAN FD) database and trace engineering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kankan Sarkar", email = "kankan_sarkar@outlook.com" },
]
keywords = ["mcp", "model-context-protocol", "can-bus", "dbc", "cantools", "automotive", "j1939", "uds", "iso-tp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "cantools>=45.0.0",
    "canmatrix>=1.3.3",
    "python-can>=4.5.0",
    "polars",
    "duckdb",
    "pydantic>=2.8.0",
    # Optional canmatrix format backends (all MIT/BSD-3-Clause): without
    # these, canmatrix silently drops .arxml/.kcd/.xlsx/.eds support.
    "lxml",
    "openpyxl",
    "canopen",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
can-engineering-mcp = "can_mcp.server:main"

[project.urls]
Homepage = "https://github.com/kankan-sarkar/canbus-mcp"
Repository = "https://github.com/kankan-sarkar/canbus-mcp"
Issues = "https://github.com/kankan-sarkar/canbus-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/can_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
